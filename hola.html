<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Óptica Briangie — Historia Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E1;
    --cream-deep: #F3E7CB;
    --paper: #FFFDF8;
    --gold: #B8892E;
    --gold-soft: #D4AF60;
    --gold-line: #CBA24A;
    --brown: #3A2416;
    --brown-soft: #6B5334;
    --brown-faint: #8C7452;
    --rule: #CDB27F;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    padding: 36px 16px;
    background:
      radial-gradient(circle at 12% 8%, rgba(212,175,96,.10), transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(212,175,96,.12), transparent 45%),
      var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--brown);
    -webkit-font-smoothing: antialiased;
  }

  .sheet{
    max-width: 900px;
    margin: 0 auto;
    background: var(--paper);
    position: relative;
    padding: 44px 54px 40px 54px;
    border: 1.5px solid var(--gold);
    box-shadow: 0 18px 50px -20px rgba(90, 63, 20, .35);
  }
  .sheet::before{
    content:"";
    position:absolute;
    inset: 9px;
    border: 1px solid var(--gold-soft);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  .letterhead{
    display:flex;
    align-items:center;
    gap: 22px;
    padding-bottom: 18px;
    border-bottom: 1.5px solid var(--gold);
    margin-bottom: 22px;
  }
  .letterhead img{
    width: 92px;
    height: 92px;
    object-fit: contain;
    flex: none;
  }
  .letterhead .brandtext{ flex: 1; }
  .letterhead .marca{
    font-family:'Cormorant Garamond', serif;
    font-size: 30px;
    letter-spacing: 2px;
    color: var(--brown);
    line-height: 1;
    margin: 0;
  }
  .letterhead .marca b{ color: var(--gold); font-weight: 600; }
  .letterhead .slogan{
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brown-faint);
    margin-top: 6px;
  }
  .letterhead .doc-title{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--gold);
    text-align: right;
    white-space: nowrap;
  }

  .fecha-row{
    display:flex;
    justify-content:flex-end;
    align-items: baseline;
    gap: 8px;
    margin: 4px 0 26px 0;
    font-size: 12.5px;
    color: var(--brown-soft);
  }

  /* ---------- Section headers ---------- */
  .section-header{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 30px 0 16px 0;
  }
  .section-header span{
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 3.5px;
    color: var(--gold);
    white-space: nowrap;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-header span::before,
  .section-header span::after{
    content:"";
    width: 5px;
    height: 5px;
    background: var(--gold-soft);
    transform: rotate(45deg);
    flex: none;
  }
  .section-header::before,
  .section-header::after{
    content:"";
    height:3px;
    flex:1;
    background:
      linear-gradient(90deg, transparent, var(--gold) 12%, var(--gold) 88%, transparent) top / 100% 1px no-repeat,
      linear-gradient(90deg, transparent, var(--gold-soft) 12%, var(--gold-soft) 88%, transparent) bottom / 100% 1px no-repeat;
  }
  .section-header:first-of-type{ margin-top: 6px; }

  .subsection-header{
    font-family: 'Jost', sans-serif;
    font-size: 11.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brown);
    background: var(--cream-deep);
    display:inline-block;
    padding: 5px 16px;
    margin: 16px 0 12px 0;
    border-left: 3px solid var(--gold);
  }

  /* ---------- Rows / fields ---------- */
  .row{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap: 6px 12px;
    margin: 13px 0;
    font-size: 13px;
  }
  .row.indent{ margin-left: 18px; }

  label{
    font-weight: 500;
    color: var(--brown-soft);
    white-space: nowrap;
    font-size: 12.5px;
    letter-spacing: .3px;
  }
  label.normal{ font-weight: 400; color: var(--brown-faint); }
  label.strong{
    font-weight: 600;
    color: var(--brown);
    text-transform: uppercase;
    font-size: 11.5px;
    letter-spacing: 1.2px;
  }

  input[type="text"]{
    border: none;
    border-bottom: 1px dotted var(--brown-faint);
    background: transparent;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    color: var(--brown);
    padding: 4px 6px;
    transition: border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus{
    outline: none;
    border-bottom: 1.5px solid var(--gold);
    background: rgba(212,175,96,.06);
  }

  select{
    appearance: none;
    -webkit-appearance: none;
    border: none;
    border-bottom: 1px dotted var(--brown-faint);
    background: transparent;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M0 0 L5 7 L10 0 Z' fill='%23B8892E'/></svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    color: var(--brown);
    padding: 4px 20px 4px 6px;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
  }
  select:invalid{ color: var(--brown-faint); }
  select:focus{
    outline: none;
    border-bottom: 1.5px solid var(--gold);
    background-color: rgba(212,175,96,.06);
  }
  select.sel-sino{ width: 78px; flex: none; }
  select.sel-sexo{ width: 130px; flex: none; }
  select.sel-opt{ min-width: 150px; }
  .fill.select-fill{ flex: 1 1 auto; }

  .fill{ flex: 1 1 auto; min-width: 40px; }
  .fill-wide{ flex: 3 1 260px; min-width: 220px; }
  .w-30{width:30px;} .w-40{width:40px;} .w-50{width:50px;} .w-60{width:60px;}
  .w-70{width:70px;} .w-80{width:80px;} .w-90{width:90px;} .w-100{width:100px;}
  .w-120{width:120px;} .w-150{width:150px;} .w-160{width:160px;} .w-180{width:180px;}
  .w-200{width:200px;}

  .check-item{
    display:inline-flex;
    align-items:center;
    gap: 5px;
    white-space: nowrap;
    font-size: 12.5px;
    color: var(--brown-soft);
    margin-right: 2px;
  }
  input[type="checkbox"]{
    appearance: none;
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border: 1.3px solid var(--gold);
    background: var(--paper);
    position: relative;
    cursor: pointer;
    flex: none;
    margin: 0;
  }
  input[type="checkbox"]:checked{ background: var(--gold-soft); }
  input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left: 3px; top: -1px;
    width: 4px; height: 8px;
    border: solid var(--paper);
    border-width: 0 1.6px 1.6px 0;
    transform: rotate(40deg);
  }

  .checkgroup{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 6px 14px;
    margin: 8px 0;
  }

  .eval-title{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--brown);
    margin: 18px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1px dotted var(--rule);
  }

  .remitido-row{
    display:flex;
    justify-content:flex-end;
    gap: 14px;
    margin: 8px 0 4px 18px;
  }

  .recom-oft{
    margin: 18px 0 6px 0;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
  }

  /* ---------- Footer ---------- */
  .footer{
    display:flex;
    justify-content: space-between;
    align-items:flex-end;
    margin-top: 54px;
    padding-top: 18px;
  }
  .footer .firma{
    text-align:center;
    min-width: 260px;
  }
  .footer .firma .linea{
    border-top: 1px solid var(--brown-faint);
    margin-bottom: 6px;
    height: 36px;
  }
  .footer .firma span{
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--brown-soft);
    text-transform: uppercase;
  }
  .footer .sello{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--gold);
  }

  @media print{
    body{ background:#fff; padding:0; }
    .sheet{ box-shadow:none; border: 1px solid var(--gold); }
  }

  @media (max-width: 620px){
    .sheet{ padding: 28px 20px; }
    .letterhead{ flex-direction: column; text-align:center; }
    .letterhead .doc-title{ text-align:center; }
    .fecha-row{ justify-content:flex-start; }
  }
</style>
</head>
